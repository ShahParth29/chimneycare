{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block nav %}{% endblock %}
{% block footer %}{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__logo">🔥 ChimneyCare</div>
    <p class="auth-card__subtitle">Welcome back. Sign in to your account.</p>

    <form method="post" action="{{ url_for('auth.login') }}" data-validate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-input" 
               placeholder="you@example.com" required autocomplete="email">
        <span class="form-error"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div style="position:relative;">
          <input type="password" id="password" name="password" class="form-input" 
                 placeholder="Enter your password" required autocomplete="current-password">
          <button type="button" class="password-toggle" 
                  style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.1rem;">👁</button>
        </div>
      </div>

      <button type="submit" class="btn btn--primary btn--full btn--lg">Sign In</button>
    </form>

    <div class="auth-card__footer">
      Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a>
    </div>

    <div class="auth-card__divider">— or —</div>

    <div class="text-center">
      <a href="{{ url_for('auth.admin_login') }}" style="font-size: 0.8rem; color: var(--steel-300);">
        Admin Portal →
      </a>
    </div>
  </div>
</div>
{% endblock %}

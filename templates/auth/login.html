{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block nav %}{% endblock %}
{% block footer %}{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <a href="{{ url_for('services.landing') }}" class="auth-card__logo" style="display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; margin-bottom: 8px;">
      <img src="{{ url_for('static', filename='images/logo-icon.svg') }}" alt="ChimneyCare Logo" style="width: 40px; height: 40px; border-radius: 10px;" />
      <span style="font-family: var(--font-heading); font-size: 1.5rem; font-weight: 800; color: var(--charcoal-900);">Chimney<span style="color: var(--orange-500);">Care</span></span>
    </a>


    <p class="auth-card__subtitle">Welcome back. Sign in to your account.</p>

    <form method="post" action="{{ url_for('auth.login') }}" data-validate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-input" 
               placeholder="you@example.com" required autocomplete="email">
        <span class="form-error"></span>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-xs);">
          <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
          <a href="{{ url_for('auth.forgot_password') }}" style="font-size: 0.8rem; color: var(--orange-500); text-decoration: none; font-weight: 600;">
            Forgot Password?
          </a>
        </div>
        <div style="position:relative;">
          <input type="password" id="password" name="password" class="form-input" 
                 placeholder="Enter your password" required autocomplete="current-password">
          <button type="button" class="password-toggle" 
                  style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.1rem;">👁</button>
        </div>
      </div>

      <button type="submit" class="btn btn--primary btn--full btn--lg">Sign In</button>
    </form>

    <div class="auth-card__footer">
      Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a>
    </div>

    <div class="auth-card__divider">— or —</div>

    <div class="text-center">
      <a href="{{ url_for('auth.admin_login') }}" style="font-size: 0.8rem; color: var(--steel-300);">
        Admin Portal →
      </a>
    </div>
  </div>
</div>
{% endblock %}

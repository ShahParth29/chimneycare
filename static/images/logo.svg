<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="100%" height="100%">
  <defs>
    <!-- Vibrant Flame Gradient -->
    <linearGradient id="flameMasterGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#ff6b00" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="flameMasterShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ea580c" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left Icon Tile (54x54) -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="54" height="54" rx="14" fill="#1e293b" />

    <!-- Chimney Hood Silhouette Outline -->
    <path d="M 18 14 
             L 36 14 
             L 36 26 
             L 45 37 
             L 41 40 
             L 13 40 
             L 9 37 
             L 18 26 Z" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="3" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- Bottom Filter Rim Bar -->
    <line x1="14" y1="40" x2="40" y2="40" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

    <!-- Rising Flame Inside Hood -->
    <path d="M 27 20 
             C 27 20, 34 27, 34 32 
             C 34 37, 31 40, 27 40 
             C 23 40, 20 37, 20 32 
             C 20 27, 27 20, 27 20 Z" 
          fill="url(#flameMasterGrad)" 
          filter="url(#flameMasterShadow)" />

    <!-- Inner Flame White Core -->
    <path d="M 27 28 
             C 27 28, 30 31, 30 34 
             C 30 37, 28.5 38.5, 27 38.5 
             C 25.5 38.5, 24 37, 24 34 
             C 24 31, 27 28, 27 28 Z" 
          fill="#ffffff" 
          opacity="0.9" />

    <!-- Sparkle Star -->
    <path d="M 33 22 Q 33 24 35 24 Q 33 24 33 26 Q 33 24 31 24 Q 33 24 33 22 Z" fill="#fbbf24" />
  </g>

  <!-- Right Typography: ChimneyCare -->
  <g transform="translate(72, 10)">
    <!-- Main Brand Name -->
    <text x="0" y="32" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="26" font-weight="800" fill="#0f172a" letter-spacing="-0.3px">
      Chimney<tspan fill="#ff6b00">Care</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="1" y="47" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#64748b" letter-spacing="1.2px" text-transform="uppercase">
      Kitchen Safety &amp; Services
    </text>
  </g>
</svg>

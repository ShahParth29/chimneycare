<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Vibrant Flame Gradient -->
    <linearGradient id="flameIconGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#ff6b00" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="flameIconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ea580c" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Rounded Shield / Tile (Subtle Brand Background) -->
  <rect x="4" y="4" width="92" height="92" rx="20" fill="#1e293b" />

  <!-- Chimney Hood Silhouette Outline -->
  <path d="M 32 24 
           L 68 24 
           L 68 46 
           L 84 66 
           L 78 72 
           L 22 72 
           L 16 66 
           L 32 46 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="5.5" 
        stroke-linejoin="round" 
        stroke-linecap="round" />

  <!-- Bottom Filter Rim Bar -->
  <line x1="24" y1="72" x2="76" y2="72" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" />

  <!-- Rising Flame Inside Hood -->
  <path d="M 50 36 
           C 50 36, 62 48, 62 58 
           C 62 67, 56 72, 50 72 
           C 44 72, 38 67, 38 58 
           C 38 48, 50 36, 50 36 Z" 
        fill="url(#flameIconGrad)" 
        filter="url(#flameIconShadow)" />

  <!-- Inner Flame White Core -->
  <path d="M 50 50 
           C 50 50, 56 56, 56 61 
           C 56 66, 53 69, 50 69 
           C 47 69, 44 66, 44 61 
           C 44 56, 50 50, 50 50 Z" 
        fill="#ffffff" 
        opacity="0.9" />

  <!-- Sparkle Star -->
  <path d="M 60 38 Q 60 42 64 42 Q 60 42 60 46 Q 60 42 56 42 Q 60 42 60 38 Z" fill="#fbbf24" />
</svg>
